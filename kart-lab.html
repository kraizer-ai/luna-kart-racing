<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>LUNA KART · 카트 보기</title>
  <link rel="icon" href="data:," />
  <style>:root{--ink:#16201c;--soft:#5d6a64;--line:#c3ccc7;--paper:#f3f5f3;--accent:#e8551f}html,body{height:100%;color:var(--ink);-webkit-tap-highlight-color:transparent;background:#cfd6d2;margin:0;font:14px/1.45 Pretendard,Malgun Gothic,Apple SD Gothic Neo,sans-serif;overflow:hidden}canvas{outline:none;width:100vw;height:100dvh;display:block;position:fixed;inset:0}#note{opacity:.75;pointer-events:none;white-space:pre;color:#dfe8e2;position:fixed;bottom:12px;left:14px}.lab-top{padding:max(10px, env(safe-area-inset-top)) 14px 8px;pointer-events:none;align-items:center;gap:12px;display:flex;position:fixed;top:0;left:0;right:0}.lab-top h1{letter-spacing:.08em;margin:0;font-size:15px;font-weight:800}.lab-top small{color:var(--soft)}.lab-top a{pointer-events:auto;color:var(--ink);border:1px solid var(--line);background:#ffffffb8;border-radius:999px;margin-left:auto;padding:6px 12px;font-weight:600;text-decoration:none}.lab-name{pointer-events:none;position:fixed;top:52px;left:16px}.lab-name b{letter-spacing:.04em;font-size:30px;font-style:italic;font-weight:900;line-height:1;display:block}.lab-name span{color:var(--soft);font-weight:600}.lab-panel{box-sizing:border-box;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-left:1px solid var(--line);background:#f3f5f3e6;width:318px;padding:56px 14px 16px;position:fixed;top:0;bottom:0;right:0;overflow-y:auto}.lab-panel h2{letter-spacing:.08em;color:var(--soft);margin:14px 0 6px;font-size:12px;font-weight:700}.lab-panel h2:first-child{margin-top:0}.lab-row{flex-wrap:wrap;gap:6px;display:flex}.lab-row button{border:1px solid var(--line);min-height:38px;color:var(--ink);font:inherit;cursor:pointer;background:#fff;border-radius:10px;flex:auto;padding:6px 10px;font-weight:600}.lab-row button small{color:var(--soft);font-size:11px;font-weight:500;display:block}.lab-row button.selected{border-color:var(--ink);background:var(--ink);color:#fff}.lab-row button.selected small{color:#c9d3ce}.lab-row button:disabled{opacity:.45;cursor:default}.lab-kart button{text-align:left;flex:46%}.lab-kart button b{letter-spacing:.03em;font-style:italic}.lab-stats{color:var(--soft);white-space:pre-line;margin-top:12px;font-size:12px}.lab-busy{color:#fff;pointer-events:none;background:#16201ce0;border-radius:12px;padding:10px 16px;font-weight:600;transition:opacity .25s;position:fixed;top:46%;left:50%;transform:translate(-50%,-50%)}.lab-busy.hidden{opacity:0}@media (width<=760px),(orientation:portrait){.lab-panel{width:auto;height:43dvh;padding:10px 12px max(12px, env(safe-area-inset-bottom));border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;inset:auto 0 0}.lab-name b{font-size:24px}.lab-row button{min-height:42px}}body.old .lab-top,body.old .lab-name,body.old .lab-panel,body.old .lab-busy,.hero-back{display:none}body.hero{background:#070b0a}body.hero .lab-top,body.hero .lab-name,body.hero .lab-panel,body.hero .lab-busy,body.hero #note{display:none}body.hero .hero-back{background:radial-gradient(46% 20% at 63% 84%, #fff3 0%, transparent 70%), radial-gradient(90% 60% at 64% 80%, color-mix(in srgb, var(--model) 30%, transparent) 0%, transparent 62%), linear-gradient(180deg, #0a1110 0%, #101a18 46%, #18231f 61%, #0d1413 61.2%, #070b0a 100%);display:block;position:fixed;inset:0;overflow:hidden}.hero-moon{aspect-ratio:1;opacity:.5;filter:blur(.3px);border-radius:50%;width:13vmin;position:absolute;top:9%;left:7%;box-shadow:inset -2.6vmin -1.2vmin #e9e4d0}.hero-word{letter-spacing:-.02em;color:color-mix(in srgb, var(--model) 46%, #101816);opacity:.62;white-space:nowrap;font:italic 900 21vw/.82 Arial Black,Arial,sans-serif;position:absolute;top:14%;right:3%}.hero-sub{letter-spacing:.5em;color:#cfd8d2;opacity:.7;font:700 1.5vw/1 Malgun Gothic,sans-serif;position:absolute;top:calc(14% + 17.6vw);right:4.4%}.hero-ripples{opacity:.5;background:repeating-radial-gradient(120% 60% at 62% -8%,#0000 0 34px,#ffffff0f 34px 36px);position:absolute;inset:61.2% 0 0}body.hero canvas{z-index:1}@media (orientation:portrait){.hero-word{font-size:24.5vw;top:7%;left:4%;right:auto}.hero-sub{font-size:3vw;top:calc(7% + 21vw);left:5.5%;right:auto}body.hero .hero-back{background:radial-gradient(70% 16% at 50% 80%, #fff3 0%, transparent 70%), radial-gradient(120% 50% at 50% 80%, color-mix(in srgb, var(--model) 30%, transparent) 0%, transparent 62%), linear-gradient(180deg, #0a1110 0%, #101a18 50%, #18231f 66%, #0d1413 66.2%, #070b0a 100%)}.hero-ripples{top:66.2%}.hero-moon{top:25%;left:auto;right:9%}}</style>
  
  <link rel="modulepreload" href="./assets/preload-helper-DIbePYYx.js">
</head>
<body>
  <div class="hero-back"><div class="hero-moon"></div><div class="hero-ripples"></div><div class="hero-word" id="heroWord"></div><div class="hero-sub" id="heroSub"></div></div>
  <canvas id="labCanvas" tabindex="0"></canvas>
  <div id="note"></div>
  <header class="lab-top"><h1>LUNA KART</h1><small>카트 보기</small><a href="./index.html">게임으로</a></header>
  <div class="lab-name"><b id="labModel"></b><span id="labTrait"></span></div>
  <section class="lab-panel" id="labPanel" aria-label="카트 보기 조작">
    <h2>카트</h2><div class="lab-row lab-kart" id="labKarts"></div>
    <h2>보는 자리</h2><div class="lab-row" id="labViews"></div>
    <h2>가까이 보기</h2><div class="lab-row" id="labFocus"></div>
    <h2>움직여 보기</h2><div class="lab-row" id="labDemos"></div>
    <h2>정밀도</h2><div class="lab-row" id="labTiers"></div>
    <div class="lab-stats" id="labStats"></div>
  </section>
  <div class="lab-busy hidden" id="labBusy">카트를 만드는 중</div>
<script>
addEventListener('DOMContentLoaded',async()=>{
  function load(src,type){return new Promise((resolve,reject)=>{const s=document.createElement('script');if(type)s.type=type;s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('카트 보기 자료를 열지 못했습니다.'));document.body.append(s);});}
  try{if(location.protocol==='file:'){await load('./offline/assets.js');await load('./offline/lab.js');}else await load("./assets/kart-lab-nU4SmMzw.js",'module');}
  catch(error){document.getElementById('labBusy').textContent=error.message;window.lunaError={message:error.message};}
});
</script>
</body>
</html>
